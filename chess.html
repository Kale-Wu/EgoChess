<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #f5f0e8; --dark: #1a1a2e; --accent: #c9a84c;
    --muted: #8a7f72; --light-sq: #f0d9b5; --dark-sq: #b58863;
  }
  body {
    background: var(--dark); color: var(--cream);
    font-family: 'Lato', sans-serif; font-weight: 300;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 2rem; gap: 0;
  }
  h1 { font-family:'Playfair Display',serif; font-size:2.2rem; font-weight:400; letter-spacing:.08em; color:var(--accent); margin-bottom:.25rem; }
  .subtitle { font-size:.78rem; color:var(--muted); letter-spacing:.2em; text-transform:uppercase; margin-bottom:1.5rem; }

  .layout { display:flex; gap:2.5rem; align-items:flex-start; }
  .board-col { display:flex; gap:6px; align-items:flex-start; }
  .rank-labels { display:flex; flex-direction:column; }
  .rank-label { height:68px; display:flex; align-items:center; justify-content:center; font-size:.7rem; color:var(--muted); width:14px; user-select:none; }
  .board-inner { display:flex; flex-direction:column; }
  #board { display:grid; grid-template-columns:repeat(8,68px); grid-template-rows:repeat(8,68px); border:2px solid #3a3050; box-shadow:0 0 60px rgba(201,168,76,.12); position:relative; }
  .file-labels { display:flex; margin-top:5px; }
  .file-label { width:68px; text-align:center; font-size:.7rem; color:var(--muted); user-select:none; }

  .square { width:68px; height:68px; position:relative; cursor:pointer; }
  .square.light { background:var(--light-sq); }
  .square.dark  { background:var(--dark-sq); }
  .square.selected   { background:rgba(80,180,80,.55) !important; }
  .square.last-from  { box-shadow:inset 0 0 0 4px rgba(201,168,76,.45); }
  .square.last-to    { box-shadow:inset 0 0 0 4px rgba(201,168,76,.7); }
  .square.in-check   { background:rgba(210,40,40,.5) !important; }
  .square.legal-move::after {
    content:''; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); width:26px; height:26px;
    background:rgba(30,140,30,.45); border-radius:50%;
    pointer-events:none; z-index:2;
  }
  .square.legal-capture::after {
    content:''; position:absolute; inset:0;
    border:6px solid rgba(30,140,30,.5);
    pointer-events:none; z-index:2;
  }

  .piece-wrap {
    position:absolute; inset:2px; display:flex;
    align-items:center; justify-content:center;
    z-index:1; cursor:grab; user-select:none;
  }
  .piece-wrap img { width:100%; height:100%; display:block; pointer-events:none; user-select:none; draggable:false; }
  .piece-wrap.dragging { opacity:.25; }

  #drag-ghost { position:fixed; pointer-events:none; z-index:9999; display:none; transform:translate(-50%,-50%); width:72px; height:72px; }
  #drag-ghost img { width:100%; height:100%; }

  .panel { width:210px; display:flex; flex-direction:column; gap:1.2rem; padding-top:4px; }
  .box { background:#24233a; border:1px solid #3a3050; border-radius:8px; padding:1rem 1.2rem; }
  .box-label { font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:.5rem; }
  .turn-row { display:flex; align-items:center; gap:10px; }
  #turn-dot { width:14px; height:14px; border-radius:50%; background:#f5f0e8; border:2px solid #aaa; flex-shrink:0; transition:background .3s,border-color .3s; }
  #turn-dot.black { background:#1a1a2e; border-color:var(--accent); }
  #turn-text { font-size:.85rem; }
  #status { font-family:'Playfair Display',serif; font-size:.95rem; line-height:1.4; }
  #move-list { font-size:.8rem; color:var(--muted); line-height:1.9; max-height:200px; overflow-y:auto; }
  #move-list .n { color:#3a3050; margin-right:4px; }
  #move-list .w { color:var(--cream); margin-right:8px; }
  #move-list .b { color:var(--accent); }

  button {
    width:100%; background:transparent; border:1px solid #3a3050; color:var(--muted);
    padding:.6rem 1rem; border-radius:6px; font-family:'Lato',sans-serif;
    font-size:.78rem; letter-spacing:.12em; text-transform:uppercase;
    cursor:pointer; transition:border-color .2s,color .2s;
  }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.active { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<h1>Chess</h1>
<p class="subtitle">Two Player</p>

<div class="layout">
  <div class="board-col">
    <div class="rank-labels" id="rank-labels"></div>
    <div class="board-inner">
      <div id="board"></div>
      <div class="file-labels" id="file-labels"></div>
    </div>
  </div>

  <div class="panel">
    <div class="box">
      <div class="turn-row"><div id="turn-dot"></div><span id="turn-text">White to move</span></div>
    </div>
    <div class="box">
      <div class="box-label">Status</div>
      <div id="status">Game in progress</div>
    </div>
    <div class="box">
      <div class="box-label">Moves</div>
      <div id="move-list"></div>
    </div>
    <button onclick="resetGame()">New Game</button>
  </div>
</div>

<div id="drag-ghost"><img id="ghost-img" src="" alt=""/></div>

<script>
// ── PIECE SOURCES ─────────────────────────────────────────────────────────────
function pieceUrl(piece) {
  return 'https://lichess1.org/assets/_RZT3co/piece/cburnett/' + piece + '.svg';
}

// ── STATE ─────────────────────────────────────────────────────────────────────
var game     = new Chess();
var selected = null;
var legal    = [];
var lastMove = null;
var dragging = false;
var dragFrom = null;
var dragGhost   = document.getElementById('drag-ghost');
var ghostImg    = document.getElementById('ghost-img');
var FILES = 'abcdefgh';
var PIECES = ['wK','wQ','wR','wB','wN','wP','bK','bQ','bR','bB','bN','bP'];

// ── BUILD BOARD ───────────────────────────────────────────────────────────────
function buildBoard() {
  var board = document.getElementById('board');
  board.innerHTML = '';

  var rankLabels = document.getElementById('rank-labels');
  rankLabels.innerHTML = '';
  for (var r = 0; r < 8; r++) {
    var rl = document.createElement('div');
    rl.className = 'rank-label';
    rl.textContent = 8 - r;
    rankLabels.appendChild(rl);
  }
  var fileLabels = document.getElementById('file-labels');
  fileLabels.innerHTML = '';
  for (var f = 0; f < 8; f++) {
    var fl = document.createElement('div');
    fl.className = 'file-label';
    fl.textContent = FILES[f];
    fileLabels.appendChild(fl);
  }
  for (var rank = 0; rank < 8; rank++) {
    for (var file = 0; file < 8; file++) {
      var sq = document.createElement('div');
      var name = FILES[file] + (8 - rank);
      sq.className = 'square ' + ((file + rank) % 2 === 0 ? 'dark' : 'light');
      sq.dataset.sq = name;
      sq.addEventListener('click', onSquareClick);
      board.appendChild(sq);
    }
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function findKingSquare(color) {
  var board = game.board();
  for (var r = 0; r < 8; r++)
    for (var f = 0; f < 8; f++)
      if (board[r][f] && board[r][f].type === 'k' && board[r][f].color === color)
        return FILES[f] + (8 - r);
  return null;
}

function render() {
  var checkSq = game.in_check() ? findKingSquare(game.turn()) : null;

  document.querySelectorAll('.square').forEach(function(el) {
    var name  = el.dataset.sq;
    var piece = game.get(name);

    var old = el.querySelector('.piece-wrap');
    if (old) el.removeChild(old);

    if (piece) {
      var key  = piece.color + piece.type.toUpperCase();
      var wrap = document.createElement('div');
      wrap.className  = 'piece-wrap';
      wrap.dataset.sq = name;
      var img = document.createElement('img');
      img.src     = pieceUrl(key);
      img.alt     = key;
      img.draggable = false;
      wrap.appendChild(img);
      wrap.addEventListener('mousedown', onPieceMouseDown);
      el.appendChild(wrap);
    }

    el.classList.remove('selected','last-from','last-to','in-check','legal-move','legal-capture');
    if (name === selected)                  el.classList.add('selected');
    if (lastMove && name === lastMove.from) el.classList.add('last-from');
    if (lastMove && name === lastMove.to)   el.classList.add('last-to');
    if (name === checkSq)                   el.classList.add('in-check');
    legal.forEach(function(m) {
      if (m.to === name) el.classList.add(game.get(name) ? 'legal-capture' : 'legal-move');
    });
  });
}

// ── CLICK-TO-MOVE (toggle) ────────────────────────────────────────────────────
function onSquareClick(e) {
  if (dragging) return;
  if (game.game_over()) return;
  var name  = e.currentTarget.dataset.sq;
  var piece = game.get(name);

  // Toggle off if already selected
  if (selected === name) { selected = null; legal = []; render(); return; }

  if (selected) {
    var move = legal.find(function(m) { return m.to === name; });
    if (move) { doMove(selected, name); return; }
    if (piece && piece.color === game.turn()) {
      selected = name;
      legal = game.moves({ square: name, verbose: true });
      render(); return;
    }
    selected = null; legal = []; render(); return;
  }

  if (piece && piece.color === game.turn()) {
    selected = name;
    legal = game.moves({ square: name, verbose: true });
    render();
  }
}

// ── DRAG AND DROP ─────────────────────────────────────────────────────────────
function onPieceMouseDown(e) {
  if (game.game_over()) return;
  var sq    = e.currentTarget.dataset.sq;
  var piece = game.get(sq);
  if (!piece || piece.color !== game.turn()) return;
  e.preventDefault();

  dragging = true;
  dragFrom = sq;
  selected = sq;
  legal = game.moves({ square: sq, verbose: true });
  render();

  var key = piece.color + piece.type.toUpperCase();
  ghostImg.src = pieceUrl(key);
  dragGhost.style.display = 'block';
  positionGhost(e.clientX, e.clientY);

  var wrap = document.querySelector('.square[data-sq="' + sq + '"] .piece-wrap');
  if (wrap) wrap.classList.add('dragging');

  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);
}

function positionGhost(x, y) {
  dragGhost.style.left = x + 'px';
  dragGhost.style.top  = y + 'px';
}

function onMouseMove(e) { if (dragging) positionGhost(e.clientX, e.clientY); }

function onMouseUp(e) {
  if (!dragging) return;
  dragging = false;
  dragGhost.style.display = 'none';
  document.removeEventListener('mousemove', onMouseMove);
  document.removeEventListener('mouseup', onMouseUp);

  var wrap = document.querySelector('.square[data-sq="' + dragFrom + '"] .piece-wrap');
  if (wrap) wrap.classList.remove('dragging');

  var target = document.elementFromPoint(e.clientX, e.clientY);
  var targetSq = null;
  if (target) { var sqEl = target.closest('.square'); if (sqEl) targetSq = sqEl.dataset.sq; }

  if (targetSq && targetSq !== dragFrom) {
    var move = legal.find(function(m) { return m.to === targetSq; });
    if (move) { doMove(dragFrom, targetSq); dragFrom = null; return; }
  }

  // Invalid drop — keep selection
  dragFrom = null;
}

// ── MOVE ──────────────────────────────────────────────────────────────────────
function doMove(from, to) {
  game.move({ from: from, to: to, promotion: 'q' });
  lastMove = { from: from, to: to };
  selected = null; legal = [];
  render(); updateStatus();
}

// ── STATUS ────────────────────────────────────────────────────────────────────
function updateStatus() {
  var turn     = game.turn();
  var dot      = document.getElementById('turn-dot');
  var turnText = document.getElementById('turn-text');
  var statusEl = document.getElementById('status');

  if (game.in_checkmate()) {
    statusEl.textContent = (turn === 'w' ? 'Black' : 'White') + ' wins by checkmate!';
    turnText.textContent = 'Game over';
  } else if (game.in_stalemate()) {
    statusEl.textContent = 'Stalemate — draw!'; turnText.textContent = 'Game over';
  } else if (game.in_draw()) {
    statusEl.textContent = 'Draw!'; turnText.textContent = 'Game over';
  } else {
    statusEl.textContent = game.in_check()
      ? (turn === 'w' ? 'White' : 'Black') + ' is in check!'
      : 'Game in progress';
    turnText.textContent = turn === 'w' ? 'White to move' : 'Black to move';
    dot.className = turn === 'b' ? 'black' : '';
  }

  var history = game.history();
  var html = '';
  for (var i = 0; i < history.length; i += 2) {
    html += '<div><span class="n">' + (Math.floor(i/2)+1) + '.</span>';
    html += '<span class="w">' + history[i] + '</span>';
    if (history[i+1]) html += '<span class="b">' + history[i+1] + '</span>';
    html += '</div>';
  }
  var ml = document.getElementById('move-list');
  ml.innerHTML = html;
  ml.scrollTop = ml.scrollHeight;
}

// ── RESET ─────────────────────────────────────────────────────────────────────
function resetGame() {
  game.reset();
  selected = null; legal = []; lastMove = null;
  document.getElementById('turn-dot').className = '';
  document.getElementById('turn-text').textContent = 'White to move';
  document.getElementById('status').textContent = 'Game in progress';
  document.getElementById('move-list').innerHTML = '';
  render();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildBoard();
buildSourceGrid();
reloadPieces();
</script>
</body>
</html>
